<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>测试平台</title>
<script src="/assets/{{ asset_v }}/theme.js"></script>
<link rel="stylesheet" href="/assets/{{ asset_v }}/nav.css">
<link rel="stylesheet" href="/assets/{{ asset_v }}/style.css">
</head>
<body data-page="index">
<header class="gnav" id="sidebar"></header>
<main>
  <!-- 首页布置照抄 testhub_platform/frontend/src/views/Home.vue：
       渐变底 + 居中主标题 + nav-card 网格，悬停上浮 + 图标放大 -->
  <div class="home-container">
    <h1 class="main-title">自动化测试平台</h1>

    <div class="cards-container">
      <a class="nav-card" href="/run">
        <div class="card-icon icon-blue"><span class="ico" data-ico="target"></span></div>
        <h3>APP自动化</h3>
        <p>项目管理 · 元素管理 · 设备配置与用例执行</p>
      </a>

      <a class="nav-card" href="/api-test">
        <div class="card-icon icon-green"><span class="ico" data-ico="flask"></span></div>
        <h3>接口测试</h3>
        <p>接口管理 · 自动化套件 · 定时任务 · 环境变量 · Allure 报告</p>
      </a>

      <a class="nav-card" href="/locator" target="_blank" rel="noopener">
        <div class="card-icon icon-purple"><span class="ico" data-ico="scan"></span></div>
        <h3>元素定位器</h3>
        <p>截图点选采集元素，一键写入元素库</p>
      </a>

      <a class="nav-card" href="/ai-case">
        <div class="card-icon icon-indigo"><span class="ico" data-ico="ai"></span></div>
        <h3>AI 用例生成</h3>
        <p>输入需求，AI 结合真实 App 页面生成并验证自动化用例</p>
        <p class="ai-card-status" id="aiCaseStatus" hidden></p>
      </a>

      <!-- 设备连接（SoloPi 无线化）：卡片进连接页，「扫码连接」直接弹二维码 -->
      <div class="nav-card" id="cardConnect" data-href="/connect" tabindex="0" role="link" aria-label="设备连接，回车进入">
        <div class="card-icon icon-cyan"><span class="ico" data-ico="qr"></span></div>
        <h3>设备连接</h3>
        <p>SoloPi 无线 · 扫码连接多设备 · adb 无线调试</p>
        <div class="card-ops">
          <button class="mini" id="btnQrHome" title="弹出二维码，设备扫码无线连接">扫码连接</button>
          <a class="btn ghost mini" href="/connect">连接配置</a>
        </div>
      </div>

      <a class="nav-card" href="#" id="cardEscrcpy" title="">
        <div class="card-icon icon-cyan"><span class="ico" data-ico="screen"></span></div>
        <h3>投屏控制台</h3>
        <p>escrcpy · 一键拉起真机实时镜像 / 远程控制 / 录屏 / 截图</p>
        <span class="ai-card-status" id="escrcpyStatus" hidden></span>
      </a>

      <a class="nav-card" href="/perf">
        <div class="card-icon icon-cyan"><span class="ico" data-ico="bolt"></span></div>
        <h3>性能压测</h3>
        <p>HTTP 接口压测，阶梯递增 / 瞬时脉冲双模式</p>
      </a>

    </div>
  </div>
</main>
<div id="toast"></div>
<script src="/assets/{{ asset_v }}/nav.js"></script>
<script src="/assets/{{ asset_v }}/app.js"></script>
</body>
</html>
