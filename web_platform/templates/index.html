<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>测试平台</title>
<script src="/assets/{{ asset_v }}/theme.js"></script>
<link rel="stylesheet" href="/assets/{{ asset_v }}/nav.css">
<link rel="stylesheet" href="/assets/{{ asset_v }}/style.css">
</head>
<body data-page="index">
<header class="gnav" id="sidebar"></header>
<main>
  <!-- 首页布置照抄 testhub_platform/frontend/src/views/Home.vue：
       渐变底 + 居中主标题 + nav-card 网格，悬停上浮 + 图标放大 -->
  <div class="home-container">
    <h1 class="main-title">自动化测试平台</h1>

    <div class="cards-container">
      <a class="nav-card" href="/run">
        <div class="card-icon icon-blue"><span class="ico" data-ico="target"></span></div>
        <h3>APP自动化</h3>
        <p>项目管理 · 元素管理 · 设备配置与用例执行</p>
      </a>

      <a class="nav-card" href="/api-test">
        <div class="card-icon icon-green"><span class="ico" data-ico="flask"></span></div>
        <h3>接口测试</h3>
        <p>接口管理 · 自动化套件 · 定时任务 · 环境变量 · Allure 报告</p>
      </a>

      <a class="nav-card" href="/locator" target="_blank" rel="noopener">
        <div class="card-icon icon-purple"><span class="ico" data-ico="scan"></span></div>
        <h3>元素定位器</h3>
        <p>截图点选采集元素，一键写入元素库</p>
      </a>

      <a class="nav-card" href="/perf">
        <div class="card-icon icon-cyan"><span class="ico" data-ico="bolt"></span></div>
        <h3>性能压测</h3>
        <p>HTTP 接口压测，阶梯递增 / 瞬时脉冲双模式</p>
      </a>

      <!-- 媒体产物检测（独立插件 media_validator/）：图标为内联 SVG（沿用平台描边风格，
           不经 app.js 注入）；删除本卡片 + app.py 两行注册即整体下线 -->
      <a class="nav-card" href="/media-validator">
        <div class="card-icon icon-orange"><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.2" y="5.2" width="17.6" height="13.6" rx="2.4"/><path d="M10 9.2l4.6 2.8L10 14.8Z"/></svg></div>
        <h3>媒体产物检测</h3>
        <p>检测音频 / 视频 / 图片产物质量，完整性 · 黑屏 · 静音 · 冻结帧</p>
      </a>
    </div>
  </div>
</main>
<div id="toast"></div>
<script src="/assets/{{ asset_v }}/nav.js"></script>
<script src="/assets/{{ asset_v }}/app.js"></script>
</body>
</html>
