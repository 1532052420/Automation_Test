<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>测试报告 · 自动化测试平台</title>
<script>if (window.self !== window.top) document.documentElement.classList.add('embedded');</script>
<script src="/assets/{{ asset_v }}/theme.js"></script>
<link rel="stylesheet" href="/assets/{{ asset_v }}/nav.css">
<link rel="stylesheet" href="/assets/{{ asset_v }}/style.css">
</head>
<body data-page="report">
<header class="gnav" id="sidebar"></header>
<main>
  <div class="pagehead">
    <h1>测试报告</h1>
    <div class="actions"><button class="danger" id="btnClearAll3">清空全部数据</button></div>
  </div>

  <!-- 执行总览（自首页迁入）：统计卡 + 最近执行 -->
  <div class="stats">
    <div class="stat s-blue" data-ico="flask"><span class="bgico"></span><div class="num" id="cardRuns">—</div><div class="label">总执行次数</div></div>
    <div class="stat s-green" data-ico="check"><span class="bgico"></span><div class="num" id="cardPass">—</div><div class="label">通过</div></div>
    <div class="stat s-red" data-ico="close"><span class="bgico"></span><div class="num" id="cardFail">—</div><div class="label">失败 / 异常</div></div>
    <div class="stat s-slate" data-ico="target"><span class="bgico"></span><div class="num" id="cardRate">—</div><div class="label">成功率</div></div>
  </div>

  <div class="card">
    <h3>最近执行</h3>
    <div class="tblwrap">
      <table>
        <thead><tr><th>Run ID</th><th>开始时间</th><th>目标</th><th>对象</th><th>共/过/失</th><th>状态</th><th>操作</th></tr></thead>
        <tbody id="recentList"></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <h3>报告列表</h3>
    <div class="tblwrap">
      <table>
        <thead><tr><th>Run ID</th><th>时间</th><th>状态</th><th>目标</th><th>报告</th><th>操作</th></tr></thead>
        <tbody id="reportList"></tbody>
      </table>
    </div>
    <div class="pager" id="reportPager"></div>
  </div>
  <div class="card mt">
    <div class="cardhead"><h3>用例执行记录</h3><span class="sub">点上方 run 的「详情」加载该次执行的用例、步骤、证据与执行日志</span></div>
    <div id="runDetail"></div>
  </div>
</main>
<div id="toast"></div>
<div class="mask" id="mask">
  <div class="modal">
    <h4 id="mTitle"></h4>
    <p id="mMsg"></p>
    <div class="mops"><button class="ghost" id="mCancel">取消</button><button id="mOk">确定</button></div>
  </div>
</div>
<script src="/assets/{{ asset_v }}/nav.js"></script>
<script src="/assets/{{ asset_v }}/app.js"></script>
</body>
</html>
