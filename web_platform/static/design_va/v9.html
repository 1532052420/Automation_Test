.foot { padding:12px 22px; background:#12151c; border-top:1px solid #1c202a; display:flex; justify-content:flex-end; gap:10px; }
.b { padding:8px 24px; border-radius:7px; font-size:13px; font-weight:600; cursor:pointer; }
.bg { background:#1a1e27; color:#cfd6e0; border:1px solid #2a3040; }
.bp { background:#0071e3; color:#fff; }
