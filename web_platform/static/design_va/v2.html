body { width:1280px; height:920px; background:rgba(6,8,12,.62); display:flex; align-items:center; justify-content:center;

.modal { width:1080px; background:#101318; border:1px solid #232833; border-radius:18px; overflow:hidden; }

.hd .t { font-size:18px; font-weight:700; color:#f0f2f5; }
.hd .badge { font-size:11.5px; color:#F59E0B; background:rgba(245,158,11,.12); border:1px solid rgba(245,158,11,.35); padding:3px 10px; border-radius:20px; }
.body { display:flex; }
.imgs { flex:1; padding:16px 20px; }
.pair { display:flex; gap:12px; margin-bottom:12px; }

.pair .box img { max-width:100%; max-height:100%; }

.side { flex:0 0 300px; padding:16px 20px; border-left:1px solid #1d222b; }
.side .row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #14181f; font-size:13px; }
.side .k { color:#7a8494; }
.side .v { color:#e8ecf2; font-weight:600; }
.simcard { margin:12px 20px 6px; background:#0b0e12; border:1px solid #1d222b; border-radius:12px; padding:14px 18px; display:flex; align-items:center; justify-content:space-between; }
.simcard .n { font-size:38px; font-weight:800; color:#EF4444; }
.simcard .l { font-size:12px; color:#7a8494; }
input.th { width:86px; padding:6px 10px; background:#0b0e12; border:1px solid #2c3542; border-radius:8px; color:#e8ecf2; font-size:15px; font-weight:700; text-align:center; }
.foot { display:flex; justify-content:flex-end; gap:12px; padding:14px 26px 18px; border-top:1px solid #1d222b; }
.b { padding:9px 28px; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer; }
.bg { background:#14161b; border:1px solid #2c3542; color:#e8ecf2; }
.bp { background:#0071e3; color:#fff; }
