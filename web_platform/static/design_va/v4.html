body { width:1280px; height:920px; background:rgba(6,8,12,.62); display:flex; align-items:center; justify-content:center;
       font-family:"PingFang SC","Microsoft YaHei",sans-serif; }
.modal { width:1060px; background:#0e1116; border:1px solid #232833; border-radius:16px; overflow:hidden; }
.hd { padding:16px 24px 10px; display:flex; justify-content:space-between; align-items:center; }
.hd .t { font-size:18px; font-weight:700; color:#f0f2f5; }
.hd .pctbadge { font-size:20px; font-weight:800; color:#EF4444; }
.wrap { position:relative; height:420px; margin:0 24px; border-radius:12px; overflow:hidden; }
.wrap img.base { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:brightness(.45); }
.wrap img.act { position:absolute; inset:0; width:50%; height:100%; object-fit:cover; object-position:left; }
.divider { position:absolute; top:0; left:50%; width:3px; height:100%; background:#0071e3; }
.knob { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:38px; height:38px; border-radius:50%;
        background:#0071e3; color:#fff; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:800; }
.tagb, .taga { position:absolute; top:10px; font-size:11px; padding:3px 10px; border-radius:5px; background:rgba(0,0,0,.6); color:#cfd6e0; }
.tagb { left:12px; } .taga { right:12px; }
.pbar { display:flex; gap:10px; padding:14px 24px 6px; }
.pchip { flex:1; background:#14161b; border:1px solid #232833; border-radius:9px; padding:7px 12px; }
.pk { font-size:10.5px; color:#7a8494; }
.pv { font-size:13px; font-weight:700; color:#e8ecf2; margin-top:2px; }
.foot { display:flex; justify-content:space-between; align-items:center; padding:12px 24px 18px; }
.foot .l { font-size:12.5px; color:#7a8494; }
.foot .r { display:flex; gap:10px; }
.b { padding:8px 22px; border-radius:9px; font-size:13.5px; font-weight:600; cursor:pointer; }
.bg { background:#14161b; border:1px solid #2c3542; color:#e8ecf2; }
.bp { background:#0071e3; color:#fff; }
