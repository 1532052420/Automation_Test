* { margin:0; padding:0; box-sizing:border-box; font-family:"PingFang SC","Microsoft YaHei",sans-serif; }
:root { --bg:#eef1f5; --card:#ffffff; --ink:#1f2937; --ink2:#374151; --mut:#6b7280; --mut2:#9ca3af;
        --line:#e5e7eb; --line2:#d1d5db; --brand:#409eff; --brand-soft:#ecf5ff;
        --amber-ink:#92400e; --amber-bg:#fffbeb; --amber-line:#f59e0b; }
html.night { --bg:#141519; --card:#1e2025; --ink:#e5e7eb; --ink2:#cfd4dc; --mut:#9aa3af; --mut2:#6b7280;

        --amber-ink:#fcd34d; --amber-bg:rgba(251,191,36,.08); --amber-line:rgba(251,191,36,.45); }

.btn.pri { background:var(--brand); border-color:var(--brand); color:#fff; }
.btn.mini { padding:5px 12px; font-size:12px; }
input[type=text], input[type=number], select { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:13px; background:var(--card); color:var(--ink); outline:none; }
input[readonly] { background:var(--brand-soft); color:var(--mut); }
.fl { font-size:12.5px; color:var(--ink2); font-weight:600; margin-bottom:6px; display:block; }
.hint { font-size:11.5px; color:var(--mut); margin-top:4px; line-height:1.5; }
.chip { display:inline-flex; align-items:center; gap:6px; font-size:11.5px; border:1px dashed var(--amber-line); color:var(--amber-ink); background:var(--amber-bg); border-radius:6px; padding:3px 8px; }
.chip b { cursor:pointer; font-weight:700; }
.chips { margin-top:7px; display:flex; gap:6px; flex-wrap:wrap; }
.seg { display:flex; background:var(--bg); border-radius:9px; padding:3px; gap:2px; }
.seg button { flex:1; padding:7px 0; font-size:12.5px; border:none; background:transparent; color:var(--mut); border-radius:7px; cursor:pointer; }
.seg button.on { background:var(--card); color:var(--brand); font-weight:600; box-shadow:0 1px 4px rgba(0,0,0,.08); }
.card { background:var(--card); border-radius:14px; padding:20px 22px; box-shadow:0 8px 30px rgba(0,0,0,.08); }
.hd { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; }
.hd .t { font-size:15.5px; font-weight:700; }
.hd .hint { margin:0; }
.f { margin-bottom:13px; }
.pv { width:100%; max-height:150px; object-fit:cover; border-radius:8px; border:1px solid var(--line); display:block; }
.foot { display:flex; justify-content:flex-end; gap:10px; padding-top:12px; border-top:1px solid var(--line); }
