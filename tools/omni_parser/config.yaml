# OmniParser 独立工具 · 手动配置（改动后重启 server.py 生效；LLM/阈值可在页面保存）

server:
  port: 8090                 # 工具独立端口；改了要同步改平台首页卡片链接

parser:
  model_dir: models          # 权重目录（相对本目录）
  device: auto               # auto / cpu / mps / cuda
  conf_threshold: 0.05       # 检测置信度阈值（OmniParser 官方推荐 0.05）
  iou_threshold: 0.45        # NMS IoU

device:
  adb_path: adb              # adb 可执行文件（也可填绝对路径，如 /Users/xxx/Library/Android/sdk/platform-tools/adb）
  udid: ""                   # 指定设备序列号；留空 = 自动用第一台在线设备
  timeout: 15                # 截屏超时（秒）

llm:
  base_url: https://open.bigmodel.cn/api/paas/v4/chat/completions   # OpenAI 兼容 chat/completions
  api_key: ""                # 手动填写（如智谱 GLM-4-Flash 免费档）
  model: glm-4-flash         # 免费档文本模型即可（纯文本决策，不需要视觉模型）
  temperature: 0.3
  timeout: 60

# 页面保存配置时写回本文件（api_key 明文，注意保管）
