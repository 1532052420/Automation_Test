# APP 随机弹窗自动处理配置（引擎：common/appium/popup_handler.py）
# 优先级：本文件 < 环境变量 POPUP_*（临时覆盖单次运行时用环境变量）
# 修改本文件后**下次执行用例**生效，无需重启平台。
#
# [popup] 段各项说明：
#   enabled           是否启用随机弹窗自动关闭（1/0）。注意：用例本身要操作某个弹窗时，
#                     该条用例执行前应设 POPUP_AUTO_CLOSE=0 暂时停用，否则弹窗会被先关掉
#   max_close_per_scan 单次扫描最多关闭的弹窗数（防嵌套弹窗无限关闭，默认 2）
#   min_scan_interval  相邻两次全量扫描的最小间隔秒数（扫描有成本，节流保护 toast 等短命元素，默认 1.2）

[popup]
enabled = 1
max_close_per_scan = 2
min_scan_interval = 1.2
