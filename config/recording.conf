# 录屏配置（平台「录屏配置」模块维护；common/video_evidence 执行时读取）
# 优先级：代码默认值 < 本文件 < 环境变量 RECORDING_*（手工临时覆盖）
# 录屏时机固定为每条用例 setup 执行前启动（覆盖启动 App 现场），不做配置。
[recording]
# 总开关：执行用例时自动录屏
enabled = true
# 录屏启动失败是否终止用例（false=只告警继续跑）
required = false
# 用例成功后保留原始录屏文件
keep_on_success = true
# 失败证据保留失败前多少秒
before_seconds = 5
# 失败后继续录制多少秒再收尾
after_seconds = 5
# 单段录制时长上限（Android screenrecord 硬上限 180s）
max_segment_seconds = 180
# 录制码率（bps）
bit_rate = 4000000
