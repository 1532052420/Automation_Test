<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>侧栏收起/展开按钮 · 10 款图标样式选样</title>
<style>
  :root{
    --ink:#1f2d3d; --sub:#5b6b7b; --line:#e3e8ee; --bg:#f5f7fa; --card:#fff;
    --blue:#2b7de9; --blue-bg:#eaf3fe; --sky:#409eff; --sky-deep:#1d6fd8;
    --dark:#1e2833; --green:#1a9e6e; --orange:#e8890c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;padding:30px 20px 70px}
  .wrap{max-width:1080px;margin:0 auto}
  header.hero{background:linear-gradient(135deg,#1d3a5f,#2b7de9);color:#fff;border-radius:16px;padding:26px 32px;margin-bottom:20px}
  .hero h1{font-size:22px}
  .hero p{opacity:.9;margin-top:6px;font-size:14px}
  .picked{margin-top:14px;background:rgba(255,255,255,.16);border:1px dashed rgba(255,255,255,.5);border-radius:10px;
    padding:10px 16px;font-size:14.5px;display:none;align-items:center;gap:12px}
  .picked.show{display:flex}
  .picked b{font-size:16px}
  .picked svg{width:24px;height:24px}

  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
  @media(max-width:900px){.grid{grid-template-columns:1fr}}
  .style-card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px 18px;cursor:pointer;transition:all .15s}
  .style-card:hover{border-color:var(--sky);box-shadow:0 2px 10px rgba(64,158,255,.12)}
  .style-card.sel{border-color:var(--sky);background:var(--blue-bg);box-shadow:0 0 0 3px rgba(64,158,255,.15)}
  .sc-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .sc-no{width:28px;height:28px;border-radius:8px;background:var(--dark);color:#fff;font-weight:700;font-size:14px;
    display:flex;align-items:center;justify-content:center;flex:none}
  .style-card.sel .sc-no{background:var(--sky)}
  .sc-name{font-size:15px;font-weight:700}
  .sc-tag{font-size:11px;color:var(--sub);background:#eef2f7;border-radius:5px;padding:1px 8px}
  .dup{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .state{border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}
  .state .st-t{font-size:12px;color:var(--sub);margin-bottom:8px}
  .icon-row{display:flex;align-items:center;justify-content:center;gap:14px}
  .icon-box{display:flex;flex-direction:column;align-items:center;gap:5px}
  .icon-box .sz{font-size:10.5px;color:var(--sub)}
  .icon-box svg{width:28px;height:28px;color:#334155}
  .icon-box.small svg{width:20px;height:20px}
  .dark-prev{background:var(--dark);border-radius:8px;padding:10px 0;display:flex;justify-content:center}
  .dark-prev svg{width:22px;height:22px;color:#cbd5e1}
  .sc-note{font-size:12.3px;color:var(--sub);margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}

  footer{margin-top:26px;color:var(--sub);font-size:12.5px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
  <h1>侧栏「收起 / 展开」按钮 · 10 款图标选样</h1>
  <p>全部 24×24 网格、描边 2、圆角端点（线性为主，5/9 号为面性供对比）。每款同时给出<b>收起态 / 展开态</b>、深色侧栏实底效果与 20px 实际按钮大小。<b>点击卡片选中</b>，选完告诉我编号即可。</p>
  <div class="picked" id="picked">已选：<b id="pickedName">—</b><span id="pickedIcon"></span></div>
</header>

<div class="grid" id="grid"></div>

<footer>元素定位器 · 侧栏收起按钮图标选样 · 2026-10-14 · 选定后按 icon-generator 规范落 SVG 源文件并导出 16~256 六档 PNG</footer>
</div>

<script>
/* ---- 10 款图标的 SVG path 定义（24×24，收起态=朝左；展开态自动镜像） ---- */
const C = 'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
const BLUE = '#409eff';
const STYLES = [
  { no: 1, name: '面板滑门', tag: '经典 sidebar 风格', note: '圆角面板 + 左分隔线 + 内嵌小箭头，与主流 IDE 的侧栏开关同款，认知零成本。',
    svg: flip => `<rect x="3" y="4" width="18" height="16" rx="3" ${C}/><line x1="9" y1="4" x2="9" y2="20" ${C}/><path d="${flip ? 'M13 9 l3 3 l-3 3' : 'M16 9 l-3 3 l3 3'}" ${C}/>` },
  { no: 2, name: '双箭头', tag: 'chevrons 最简', note: '两个并列 V 形箭头，朝左=收起、朝右=展开，一个图形 CSS 镜像即可复用，最省事。',
    svg: flip => `<path d="${flip ? 'M9 7 l5 5 l-5 5 M15 7 l3.5 3.5' : 'M15 7 l-5 5 l5 5 M9 7 l-3.5 3.5'}" ${C}/>` },
  { no: 3, name: '箭头贴线', tag: 'arrow-to-line', note: '箭头推向边线，"推到边上=收起"的语义最直白；展开态镜像为推离边线。',
    svg: flip => `<line x1="20" y1="4" x2="20" y2="20" ${C}/><path d="${flip ? 'M4 12 h11 M11 7 l5 5 l-5 5' : 'M20 12 H9 M13 7 l-5 5 l5 5'}" ${C}/>` },
  { no: 4, name: '双栏向中', tag: '收拢语义', note: '两条栏线 + 中间箭头，强调"内容向中线收拢"；展开态箭头反向。',
    svg: flip => `<line x1="4" y1="4" x2="4" y2="20" ${C}/><line x1="20" y1="4" x2="20" y2="20" ${C}/><path d="${flip ? 'M10 8 l4 4 l-4 4' : 'M14 8 l-4 4 l4 4'}" ${C}/>` },
  { no: 5, name: '圆底白箭头', tag: '面性 · 高识别', note: '主题蓝实心圆底 + 白色箭头，在深浅两种侧栏上都最醒目；展开态箭头反向。',
    svg: flip => `<circle cx="12" cy="12" r="10" fill="${BLUE}"/><path d="${flip ? 'M10 8 l4 4 l-4 4' : 'M14 8 l-4 4 l4 4'}" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>` },
  { no: 6, name: '方底箭头', tag: '线性 · 弱底', note: '圆角方框内一只 V 箭头，比 5 号安静，适合不想让按钮太跳的界面。',
    svg: flip => `<rect x="4" y="4" width="16" height="16" rx="5" ${C}/><path d="${flip ? 'M13.5 9 l-3 3 l3 3' : 'M10.5 9 l3 3 l-3 3'}" ${C}/>` },
  { no: 7, name: '分栏高亮', tag: '面板填充变体', note: '左栏填充色块代表"收起后的窄条"，右侧区域留给内容；收起态色块变窄、箭头贴边。',
    svg: flip => `<rect x="3" y="4" width="18" height="16" rx="3" ${C}/><rect x="${flip ? 5.5 : 5.5}" y="6.5" width="4" height="11" rx="1.5" fill="${BLUE}" stroke="none"/><path d="${flip ? 'M14 9 l3 3 l-3 3' : 'M16.5 9 l-3 3 l3 3'}" ${C}/>` },
  { no: 8, name: '括号相向', tag: '收拢 / 张开', note: '两个括号相向=收起、背向=展开，几何感强，与编辑器折叠按钮同族。',
    svg: flip => (flip
      ? `<path d="M9 7 l-4.5 5 l4.5 5" ${C}/><path d="M15 7 l4.5 5 l-4.5 5" ${C}/>`
      : `<path d="M13.5 7 l4.5 5 l-4.5 5" ${C}/><path d="M10.5 7 l-4.5 5 l4.5 5" ${C}/>`) },
  { no: 9, name: '半圆滑盖', tag: '面性 · 灵动', note: '蓝色半圆是"盖子"，箭头指示盖合方向；收起盖向左、展开盖向右，动效友好。',
    svg: flip => `<path d="${flip ? 'M12 4 a8 8 0 0 1 0 16 Z' : 'M12 4 a8 8 0 0 0 0 16 Z'}" fill="${BLUE}"/><path d="${flip ? 'M7.5 9 l3.5 3 l-3.5 3' : 'M16.5 9 l-3.5 3 l3.5 3'}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>` },
  { no: 10, name: '粗杆箭头', tag: 'arrow-back 大号', note: '长杆大箭头（比 3 号更饱满），语义与 3 相同；喜欢箭头存在感强就选它。',
    svg: flip => `<line x1="21" y1="4" x2="21" y2="20" ${C}/><path d="${flip ? 'M3 12 h12 M10 6 l6 6 l-6 6' : 'M21 12 H9 M15 6 l-6 6 l6 6'}" ${C}/>` },
];

const box = document.getElementById('grid');
STYLES.forEach(st => {
  const card = document.createElement('div');
  card.className = 'style-card';
  card.dataset.no = st.no;
  const iconSvg = flip => `<svg viewBox="0 0 24 24">${st.svg(flip)}</svg>`;
  card.innerHTML = `
    <div class="sc-head"><span class="sc-no">${st.no}</span><span class="sc-name">${st.name}</span><span class="sc-tag">${st.tag}</span></div>
    <div class="dup">
      <div class="state"><div class="st-t">收起态（点击后收起侧栏）</div>
        <div class="icon-row">
          <div class="icon-box">${iconSvg(false)}<span class="sz">28px</span></div>
          <div class="icon-box small">${iconSvg(false)}<span class="sz">20px 实际</span></div>
          <div class="icon-box"><div class="dark-prev">${iconSvg(false)}</div><span class="sz">深色侧栏</span></div>
        </div>
      </div>
      <div class="state"><div class="st-t">展开态（点击后展开侧栏）</div>
        <div class="icon-row">
          <div class="icon-box">${iconSvg(true)}<span class="sz">28px</span></div>
          <div class="icon-box small">${iconSvg(true)}<span class="sz">20px 实际</span></div>
          <div class="icon-box"><div class="dark-prev">${iconSvg(true)}</div><span class="sz">深色侧栏</span></div>
        </div>
      </div>
    </div>
    <div class="sc-note">${st.note}</div>`;
  card.addEventListener('click', () => {
    document.querySelectorAll('.style-card').forEach(c => c.classList.remove('sel'));
    card.classList.add('sel');
    const pk = document.getElementById('picked');
    pk.classList.add('show');
    document.getElementById('pickedName').textContent = st.no + ' 号 · ' + st.name;
    document.getElementById('pickedIcon').innerHTML = `<svg viewBox="0 0 24 24" style="color:#fff">${st.svg(false)}</svg>`;
    document.getElementById('picked').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });
  box.appendChild(card);
});
</script>
</body>
</html>
