<!DOCTYPE html>
<!-- 用例步骤编辑 · 三级页面原型（frontend-design 产出，仅设计评审用）
     视觉契约：沿用平台 style.css 令牌（--brand #0071e3 / --bg #f5f5f7 / 白面板 / 苹果系灰阶），无外部资源。
     记忆点：步骤时间轴——垂直轨道 + 分组色节点（基本操作=蓝 断言=紫 等待与分支=琥珀 其他=灰）。
     交互为原型演示：增删改/拖拽排序/实时编辑/未保存标记，保存仅弹 toast，不落数据。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>步骤编辑 · 测试（test_aaaa） · 三级页面原型</title>
<style>
  :root {
    color-scheme: light;
    --brand: #0071e3; --brand-hover: #0077ed; --brand-tint: rgba(0,113,227,.08);
    --ink: #1d1d1f; --ink2: #3a3a3c; --muted: #6e6e73; --muted2: #86868b;
    --bg: #f5f5f7; --panel: #fff; --panel2: #fbfbfd; --line: #e8e8ed;
    --danger: #e30000; --ok: #248a3d;
    /* 步骤分组色（结构编码，非装饰） */
    --g-act: #0071e3;      /* 基本操作 */
    --g-assert: #6e46c8;   /* 断言 */
    --g-wait: #b26a00;     /* 等待与分支 */
    --g-misc: #86868b;     /* 其他 */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    background: var(--bg); color: var(--ink); font-size: 13.5px; line-height: 1.5;
  }
  button { font: inherit; cursor: pointer; border: none; background: none; }
  input, select, textarea { font: inherit; color: var(--ink); }
  ::placeholder { color: var(--muted2); }

  /* ===== 顶栏面包屑（nav.js 同构） ===== */
  .gnav {
    height: 46px; background: var(--panel); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; padding: 0 18px; gap: 14px; position: sticky; top: 0; z-index: 20;
  }
  .brand { font-weight: 700; font-size: 14.5px; color: var(--ink); text-decoration: none; display: flex; gap: 7px; align-items: center; }
  .brand .logo { width: 20px; height: 20px; border-radius: 6px; background: var(--brand); color: #fff; display: grid; place-items: center; font-size: 12px; }
  .crumbs { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
  .crumbs a { color: var(--muted); text-decoration: none; }
  .crumbs a:hover { color: var(--brand); }
  .crumbs .sep { color: var(--muted2); }
  .crumbs .cur { color: var(--ink); font-weight: 600; }
  .crumbs .leaf { color: var(--brand); font-weight: 600; }

  /* ===== 左侧栏（沿用截图的深色菜单） ===== */
  .layout { display: flex; min-height: calc(100vh - 46px); }
  .sidebar {
    width: 118px; flex: none; background: #1d1d1f; color: #d6d6db;
    padding: 14px 0; display: flex; flex-direction: column; gap: 2px;
  }
  .sidebar .cap { font-size: 11px; color: #8e8e93; padding: 2px 16px 8px; }
  .sidebar a { color: #d6d6db; text-decoration: none; font-size: 13px; padding: 8px 16px; display: flex; gap: 9px; align-items: center; }
  .sidebar a:hover { background: rgba(255,255,255,.06); }
  .sidebar a.on { background: var(--brand); color: #fff; border-radius: 0 8px 8px 0; margin-right: 10px; }

  /* ===== 主体 ===== */
  .main { flex: 1; padding: 16px 20px 26px; min-width: 0; }

  /* 用例头卡 */
  .case-head {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 18px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  .back { color: var(--muted); font-size: 12.5px; text-decoration: none; display: flex; align-items: center; gap: 4px; }
  .back:hover { color: var(--brand); }
  .case-title { font-size: 19px; font-weight: 700; letter-spacing: .01em; }
  .case-meta { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 12.5px; flex-wrap: wrap; }
  .chip {
    background: var(--panel2); border: 1px solid var(--line); border-radius: 999px;
    padding: 2px 10px; font-size: 12px; color: var(--ink2);
  }
  .chip.mono { font-variant-numeric: tabular-nums; }
  .head-sp { flex: 1; }
  .dirty-dot { width: 8px; height: 8px; border-radius: 50%; background: #ff9f0a; display: none; }
  .dirty .dirty-dot { display: inline-block; }
  .dirty-lab { font-size: 12px; color: #b26a00; display: none; }
  .dirty .dirty-lab { display: inline; }
  .btn { border-radius: 8px; padding: 7px 16px; font-size: 13px; font-weight: 600; }
  .btn-ghost { border: 1px solid var(--line); background: var(--panel); color: var(--ink2); }
  .btn-ghost:hover { border-color: var(--muted2); }
  .btn-primary { background: var(--brand); color: #fff; }
  .btn-primary:hover { background: var(--brand-hover); }
  .btn-danger-ghost { border: 1px solid var(--line); color: var(--danger); background: var(--panel); }
  .btn-danger-ghost:hover { border-color: var(--danger); }

  /* ===== 双栏：时间轴 + 编辑器 ===== */
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) 372px; gap: 16px; margin-top: 16px; align-items: start; }
  @media (max-width: 1100px) { .cols { grid-template-columns: 1fr; } }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  .card-h { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }
  .card-h h3 { font-size: 14.5px; font-weight: 700; }
  .card-h .cnt { color: var(--muted2); font-weight: 400; font-size: 12.5px; }

  /* 步骤搜索 + 添加 */
  .step-tools { display: flex; gap: 8px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  .search {
    flex: 1; display: flex; align-items: center; gap: 7px; background: var(--panel2);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
  }
  .search input { border: none; outline: none; background: transparent; width: 100%; font-size: 13px; }
  .add-wrap { position: relative; }
  .add-menu {
    display: none; position: absolute; right: 0; top: calc(100% + 6px); z-index: 30;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 8px 28px rgba(0,0,0,.12); width: 190px; padding: 6px; max-height: 320px; overflow: auto;
  }
  .add-menu.open { display: block; }
  .add-menu .grp { font-size: 11.5px; color: var(--muted2); padding: 7px 10px 3px; }
  .add-menu button { display: flex; width: 100%; text-align: left; padding: 7px 10px; border-radius: 7px; gap: 8px; align-items: center; }
  .add-menu button:hover { background: var(--brand-tint); }

  /* 时间轴步骤列表 */
  .steps { padding: 6px 10px 14px; position: relative; }
  .steps::before {  /* 垂直轨道 */
    content: ""; position: absolute; left: 34px; top: 18px; bottom: 18px;
    width: 2px; background: var(--line);
  }
  .step {
    display: grid; grid-template-columns: 24px 34px minmax(0,1fr) auto; gap: 4px 8px;
    align-items: center; padding: 8px 6px 8px 0; border-radius: 10px; position: relative;
  }
  .step:hover { background: var(--panel2); }
  .step.sel { background: var(--brand-tint); box-shadow: inset 0 0 0 1px var(--brand-ring, rgba(0,113,227,.28)); }
  .step.dragging { opacity: .45; }
  .grip { color: var(--muted2); cursor: grab; text-align: center; font-size: 13px; user-select: none; }
  .node {
    width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
    color: #fff; font-size: 12px; font-weight: 700; position: relative; z-index: 1;
    border: 3px solid var(--panel);
  }
  .step.sel .node { border-color: #eaf3fd; }
  .node.act { background: var(--g-act); } .node.assert { background: var(--g-assert); }
  .node.wait { background: var(--g-wait); } .node.misc { background: var(--g-misc); }
  .s-main { min-width: 0; }
  .s-type { font-weight: 600; font-size: 13.5px; }
  .s-desc { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .s-desc b { color: var(--ink2); font-weight: 600; }
  .s-ops { display: none; gap: 2px; }
  .step:hover .s-ops, .step.sel .s-ops { display: flex; }
  .icon-btn { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; color: var(--muted); font-size: 13px; }
  .icon-btn:hover { background: var(--panel3, #f0f0f2); color: var(--ink); }
  .icon-btn.del:hover { color: var(--danger); }
  .steps-empty { padding: 26px; text-align: center; color: var(--muted2); }

  /* 断言组的期望值直接进时间轴（结构信息） */
  .badge {
    font-size: 11px; padding: 1px 8px; border-radius: 999px; font-weight: 600; color: #fff;
  }

  /* ===== 右侧编辑器 ===== */
  .editor { position: sticky; top: 62px; }
  .ed-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 13px; }
  .ed-none { padding: 40px 20px; text-align: center; color: var(--muted2); }
  .field label { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); margin-bottom: 5px; }
  .field label .req { color: var(--danger); }
  .field input[type=text], .field select, .field textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px;
    background: var(--panel); outline: none;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-tint); }
  .field textarea { resize: vertical; min-height: 46px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .el-preview {
    margin-top: 6px; background: var(--panel2); border: 1px dashed var(--line); border-radius: 8px;
    padding: 8px 10px; font-size: 12px; color: var(--muted);
  }
  .el-preview code { font-family: ui-monospace, Menlo, monospace; color: var(--ink2); font-size: 11.5px; }
  .ed-foot { display: flex; gap: 8px; padding-top: 4px; border-top: 1px solid var(--line); margin-top: 2px; padding-top: 12px; }

  /* 图例 */
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 10px; flex-wrap: wrap; }
  .legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 5px; }

  /* toast */
  #toast {
    position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: #fff; padding: 9px 18px; border-radius: 10px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: .25s; z-index: 99;
  }
  #toast.show { opacity: 1; transform: translateX(-50%); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header class="gnav">
  <a class="brand" href="#"><span class="logo">✓</span>自动化测试平台</a>
  <nav class="crumbs">
    <a href="#">首页</a><span class="sep">/</span>
    <span>APP自动化</span><span class="sep">/</span>
    <a href="#">用例管理</a><span class="sep">/</span>
    <span class="leaf">步骤编辑</span>
  </nav>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="cap">APP自动化</div>
    <a href="#">项目管理</a>
    <a href="#">元素管理</a>
    <a href="#" class="on">用例管理</a>
    <a href="#">执行用例</a>
    <a href="#">用例编排</a>
    <a href="#">测试套件</a>
    <a href="#">测试报告</a>
    <a href="#">用例上传</a>
    <a href="#">设备配置</a>
  </aside>

  <main class="main">
    <!-- 用例头卡 -->
    <div class="case-head" id="caseHead">
      <a class="back" href="#">‹ 返回用例管理</a>
      <div>
        <div class="case-title">测试</div>
        <div class="case-meta">
          <span class="chip mono">test_aaaa.py</span>
          <span class="chip">TestAaaa</span>
          <span class="chip mono" id="stepCnt">— 步</span>
          <span class="chip">项目：快歌App</span>
        </div>
      </div>
      <div class="head-sp"></div>
      <span class="dirty-dot" aria-hidden="true"></span>
      <span class="dirty-lab">未保存</span>
      <button class="btn btn-ghost" onclick="toast('已放弃修改（原型演示）')">放弃</button>
      <button class="btn btn-primary" onclick="saveCase()">保存</button>
    </div>

    <div class="cols">
      <!-- 左：步骤时间轴 -->
      <section class="card">
        <div class="card-h">
          <h3>步骤</h3>
          <span class="cnt" id="listCnt"></span>
        </div>
        <div class="step-tools">
          <div class="search">🔍<input id="q" placeholder="筛选步骤：动作 / 元素 / 参数" oninput="renderSteps()"></div>
          <div class="add-wrap">
            <button class="btn btn-ghost" id="addBtn" onclick="toggleMenu(event)">＋ 添加步骤</button>
            <div class="add-menu" id="addMenu"></div>
          </div>
        </div>
        <div class="steps" id="stepList"></div>
        <div class="legend" style="padding:0 16px 14px">
          <span><i style="background:var(--g-act)"></i>基本操作</span>
          <span><i style="background:var(--g-assert)"></i>断言</span>
          <span><i style="background:var(--g-wait)"></i>等待与分支</span>
          <span><i style="background:var(--g-misc)"></i>其他</span>
        </div>
      </section>

      <!-- 右：步骤编辑器 -->
      <section class="card editor">
        <div class="card-h"><h3>步骤编辑</h3><span class="cnt" id="edIdx"></span></div>
        <div class="ed-none" id="edNone">从左侧选择一步开始编辑<br>或点「＋ 添加步骤」新增</div>
        <div class="ed-body" id="edBody" style="display:none">
          <div class="field">
            <label>动作类型</label>
            <select id="fType" onchange="onTypeChange()"></select>
          </div>
          <div class="field" id="fElWrap">
            <label>目标元素 <span class="req">*</span></label>
            <select id="fEl" onchange="touch()"></select>
            <div class="el-preview" id="elPreview"></div>
          </div>
          <div class="field" id="fParamWrap">
            <label id="fParamLab">参数</label>
            <input type="text" id="fParam" oninput="touch()">
          </div>
          <div class="row2">
            <div class="field">
              <label>等待条件</label>
              <select id="fWait" onchange="touch()">
                <option>出现即可</option><option>可见后操作</option><option>可点击后操作</option><option>不等待</option>
              </select>
            </div>
            <div class="field">
              <label>最长等待（秒）</label>
              <input type="text" id="fSec" value="10" oninput="touch()">
            </div>
          </div>
          <div class="field">
            <label>备注（可选）</label>
            <textarea id="fNote" placeholder="给看报告的人一句话说明" oninput="touch()"></textarea>
          </div>
          <div class="ed-foot">
            <button class="btn btn-ghost" onclick="dupStep()">复制步骤</button>
            <div class="head-sp"></div>
            <button class="btn btn-danger-ghost" onclick="delStep()">删除步骤</button>
          </div>
        </div>
      </section>
    </div>
  </main>
</div>

<div id="toast"></div>

<script>
/* ---- 动作类型（与平台 STEP_META 同源：值/分组/是否需元素/参数名） ---- */
const TYPES = {
  start_app:    { label:'启动App',   group:'基本操作',  el:false, param:'包名 / App',            ph:'com.kuaige.music' },
  tap:          { label:'点击元素',   group:'基本操作',  el:true,  param:null },
  tap_xy:       { label:'点击坐标',   group:'基本操作',  el:false, param:'坐标 x,y',              ph:'540, 960' },
  input_text:   { label:'输入文本',   group:'基本操作',  el:true,  param:'文本内容',              ph:'晴天' },
  swipe:        { label:'滑动',       group:'基本操作',  el:false, param:'方向 / 起终点',         ph:'up' },
  assert_visible:{label:'断言出现',   group:'断言',      el:true,  param:null },
  assert_text:  { label:'断言文本',   group:'断言',      el:true,  param:'期望文本',              ph:'正在播放：晴天' },
  assert_toast: { label:'断言Toast',  group:'断言',      el:false, param:'toast 文本',            ph:'已加入歌单' },
  wait_element: { label:'等待出现',   group:'等待与分支',el:true,  param:null },
  if_click:     { label:'出现才点击', group:'等待与分支',el:true,  param:null },
  sleep:        { label:'固定等待',   group:'等待与分支',el:false, param:'秒数',                  ph:'2' },
  screenshot:   { label:'截图',       group:'其他',      el:false, param:null },
  custom:       { label:'自定义代码', group:'其他',      el:false, param:'一行 Python 代码',      ph:'time.sleep(1)' },
};
const GCSS = { '基本操作':'act', '断言':'assert', '等待与分支':'wait', '其他':'misc' };

/* 元素库（与元素管理同源示意） */
const ELEMENTS = {
  '悬浮球':   'id=com.kuaige.music:id/floating_ball',
  '搜索框':   'xpath=//android.widget.EditText[@text="搜索歌曲、歌手"]',
  '歌曲卡片': 'id=com.kuaige.music:id/song_card',
  '播放按钮': 'xpath=//android.widget.Button[@content-desc="播放"]',
  '返回键':   'desc=返回',
};

/* 示例步骤（真实语义：快歌 App 搜歌并播放） */
let steps = [
  { type:'start_app',     param:'com.kuaige.music', wait:'出现即可', sec:'15', note:'冷启动进首页' },
  { type:'tap',           el:'悬浮球',              wait:'可点击后操作', sec:'10', note:'' },
  { type:'tap',           el:'搜索框',              wait:'可见后操作', sec:'10', note:'' },
  { type:'input_text',    el:'搜索框', param:'晴天', wait:'可见后操作', sec:'10', note:'输入歌名' },
  { type:'tap',           el:'歌曲卡片',            wait:'可见后操作', sec:'10', note:'点首条结果' },
  { type:'if_click',      el:'播放按钮',            wait:'出现才点击', sec:'5',  note:'弹窗遮挡兜底' },
  { type:'assert_text',   el:'歌曲卡片', param:'正在播放：晴天', wait:'出现即可', sec:'10', note:'核心断言' },
  { type:'screenshot' },
];
let selId = null, dirty = false;

const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function stepDesc(s) {
  const t = TYPES[s.type];
  if (t.el && s.el) return s.el + (s.param ? ' · <b>' + esc(s.param) + '</b>' : '');
  if (s.param) return '<b>' + esc(s.param) + '</b>';
  return '<span style="color:var(--muted2)">—</span>';
}
function renderSteps() {
  const kw = ($('#q').value || '').trim().toLowerCase();
  const box = $('#stepList');
  box.innerHTML = '';
  const visible = steps.map((s, i) => ({ s, i }))
    .filter(({s}) => !kw || [TYPES[s.type].label, s.el, s.param, s.note].some(v => String(v||'').toLowerCase().includes(kw)));
  visible.forEach(({s, i}) => {
    const id = steps.indexOf(s);
    const row = document.createElement('div');
    row.className = 'step' + (id === selId ? ' sel' : '');
    row.draggable = true;
    row.innerHTML =
      '<span class="grip">☰</span>' +
      '<span class="node ' + GCSS[TYPES[s.type].group] + '">' + (i+1) + '</span>' +
      '<div class="s-main"><div class="s-type">' + TYPES[s.type].label +
        (s.type === 'screenshot' ? ' <span class="badge" style="background:var(--g-misc)">留痕</span>' : '') +
      '</div><div class="s-desc">' + stepDesc(s) +
        (s.note ? ' <span style="color:var(--muted2)">· ' + esc(s.note) + '</span>' : '') + '</div></div>' +
      '<div class="s-ops">' +
        '<button class="icon-btn" title="上移" onclick="move(' + id + ',-1)">↑</button>' +
        '<button class="icon-btn" title="下移" onclick="move(' + id + ',1)">↓</button>' +
        '<button class="icon-btn del" title="删除" onclick="delStep(' + id + ')">✕</button>' +
      '</div>';
    row.addEventListener('click', e => { if (e.target.closest('button')) return; selectStep(id); });
    row.addEventListener('dragstart', e => { row.classList.add('dragging'); });
    row.addEventListener('dragend', () => row.classList.remove('dragging'));
    row.addEventListener('dragover', e => e.preventDefault());
    box.appendChild(row);
  });
  if (!visible.length) box.innerHTML = '<div class="steps-empty">没有匹配的步骤</div>';
  $('#stepCnt').textContent = steps.length + ' 步';
  $('#listCnt').textContent = steps.length ? steps.length + ' 步' : '';
}

/* 拖拽重排（清晰版实现） */
document.addEventListener('DOMContentLoaded', () => {
  const list = $('#stepList');
  let dragFrom = -1;
  list.addEventListener('dragstart', e => {
    const row = e.target.closest('.step'); if (!row) return;
    dragFrom = [...list.children].indexOf(row);
  });
  list.addEventListener('drop', e => {
    const row = e.target.closest('.step'); if (!row || dragFrom < 0) return;
    const to = [...list.children].indexOf(row);
    if (to < 0 || to === dragFrom) return;
    const [m] = steps.splice(dragFrom, 1);
    steps.splice(to, 0, m);
    dragFrom = -1; renderSteps(); touch();
  });
});

function selectStep(id) {
  selId = id; renderSteps(); renderEditor();
}
function renderEditor() {
  const s = steps[selId];
  $('#edNone').style.display = s ? 'none' : '';
  $('#edBody').style.display = s ? '' : 'none';
  if (!s) { $('#edIdx').textContent = ''; return; }
  $('#edIdx').textContent = '第 ' + (selId + 1) + ' 步';
  const t = TYPES[s.type];
  $('#fType').value = s.type;
  $('#fElWrap').style.display = t.el ? '' : 'none';
  $('#fParamWrap').style.display = t.param ? '' : 'none';
  $('#fParamLab').textContent = t.param || '参数';
  $('#fParam').placeholder = t.ph || '';
  $('#fEl').value = s.el || '';
  $('#fParam').value = s.param || '';
  $('#fWait').value = s.wait || '出现即可';
  $('#fSec').value = s.sec || '10';
  $('#fNote').value = s.note || '';
  renderElPreview();
}
function renderElPreview() {
  const el = $('#fEl').value;
  $('#elPreview').innerHTML = el
    ? '定位：<code>' + esc(ELEMENTS[el] || '') + '</code>'
    : '未选择元素（到「元素管理」可维护元素库）';
}
function onTypeChange() {
  const t = TYPES[$('#fType').value];
  $('#fElWrap').style.display = t.el ? '' : 'none';
  $('#fParamWrap').style.display = t.param ? '' : 'none';
  $('#fParamLab').textContent = t.param || '参数';
  $('#fParam').placeholder = t.ph || '';
  touch();
}
function collect() {
  const s = steps[selId]; if (!s) return;
  s.type = $('#fType').value; s.el = $('#fEl').value || '';
  s.param = $('#fParam').value.trim(); s.wait = $('#fWait').value;
  s.sec = $('#fSec').value.trim(); s.note = $('#fNote').value.trim();
}
function touch() { dirty = true; $('#caseHead').classList.add('dirty'); collect(); renderSteps(); renderElPreview(); }

function move(id, d) {
  const j = id + d; if (j < 0 || j >= steps.length) return;
  [steps[id], steps[j]] = [steps[j], steps[id]];
  if (selId === id) selId = j; else if (selId === j) selId = id;
  renderSteps(); touch();
}
function dupStep() {
  if (selId == null) return;
  const copy = Object.assign({}, steps[selId]);
  steps.splice(selId + 1, 0, copy);
  selId = selId + 1; renderSteps(); renderEditor(); touch();
  toast('已复制为第 ' + (selId + 1) + ' 步');
}
function delStep(id) {
  if (id == null) id = selId;
  if (id == null) return;
  if (!confirm('删除第 ' + (id + 1) + ' 步？')) return;
  steps.splice(id, 1);
  selId = null; renderSteps(); renderEditor(); touch();
  toast('已删除（原型演示，不落数据）');
}
function saveCase() {
  collect();
  dirty = false; $('#caseHead').classList.remove('dirty');
  toast('已保存 · 共 ' + steps.length + ' 步（原型演示，不落数据）');
}

/* 添加步骤菜单（按分组） */
function toggleMenu(e) { e.stopPropagation(); $('#addMenu').classList.toggle('open'); }
document.addEventListener('click', () => $('#addMenu').classList.remove('open'));
(function buildMenu() {
  const menu = $('#addMenu');
  Object.entries(TYPES).forEach(([k, t]) => {
    let grp = menu.querySelector('[data-g="' + t.group + '"]');
    if (!grp) {
      const cap = document.createElement('div');
      cap.className = 'grp'; cap.dataset.g = t.group; cap.textContent = t.group;
      menu.appendChild(cap);
    }
    const b = document.createElement('button');
    b.innerHTML = '<span class="node ' + GCSS[t.group] + '" style="width:16px;height:16px;font-size:10px;border-width:2px"></span>' + t.label;
    b.onclick = () => {
      const s = { type:k, el: t.el ? Object.keys(ELEMENTS)[0] : '', param:'', wait:'出现即可', sec:'10', note:'' };
      steps.push(s); selId = steps.length - 1;
      renderSteps(); renderEditor(); touch();
      toast('已添加「' + t.label + '」');
    };
    menu.appendChild(b);
  });
})();

/* 编辑器类型下拉 + 元素库下拉 */
(function buildTypeSel() {
  const sel = $('#fType');
  Object.entries(TYPES).forEach(([k, t]) => {
    const o = document.createElement('option'); o.value = k; o.textContent = t.label + '（' + t.group + '）';
    sel.appendChild(o);
  });
  const elSel = $('#fEl');
  Object.keys(ELEMENTS).forEach(name => {
    const o = document.createElement('option'); o.value = name; o.textContent = name;
    elSel.appendChild(o);
  });
})();

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200);
}

/* 初始化：默认选中第 7 步（断言文本，最能展示编辑器） */
selId = 6;
renderSteps(); renderEditor();
</script>
</body>
</html>
